<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffres">
<link rel="manifest" href="/manifest.json?k=__KEY__">
<title>ChestCounter+</title>
<style>
:root {
  --bg: #14110d; --card: #201b15; --line: #3a3127; --text: #f3ead9; --muted: #a8998a;
  --gold: #e9b44c; --gold-dim: #8a6a2b; --green: #6fcf8f; --amber: #f0c060; --red: #e0705f;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
main { max-width: 480px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.total { font-size: 52px; font-weight: 800; color: var(--gold); letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.total small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.badge { font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.badge.Live { color: var(--red); } .badge.Confirmed, .badge.EstimateConfirmed { color: var(--green); } .badge.Estimate { color: var(--amber); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.tap { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
.tap .big { font-size: 26px; font-weight: 800; padding: 22px 10px; border-radius: 14px; border: 0; background: var(--gold); color: #1d1408; }
.tap .big:active { transform: scale(.98); background: #f5c867; }
.tap .small { min-width: 70px; font-size: 22px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--text); }
.count { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.count b { font-size: 30px; color: var(--gold); font-variant-numeric: tabular-nums; }
.help { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.ask { border-color: var(--gold-dim); }
.ask p { margin: 0 0 12px; font-weight: 600; }
.stepper { display: flex; gap: 10px; align-items: center; }
.stepper button, .row-edit button { font-size: 22px; min-width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); }
.stepper .n { flex: 1; text-align: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepper .ok, .row-edit .ok { background: var(--gold); color: #1d1408; border: 0; font-weight: 800; min-width: 74px; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.line:first-of-type { border-top: 0; }
.line .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.line .d { font-size: 12px; color: var(--muted); }
.match { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.match:first-of-type { border-top: 0; }
.match button.edit { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 6px 12px; font-size: 16px; font-weight: 700; min-width: 64px; }
.match .est { color: var(--amber); }
.row-edit { display: flex; gap: 8px; align-items: center; padding: 6px 0 10px; }
.row-edit .n { flex: 1; text-align: center; font-size: 26px; font-weight: 800; }
.forget { background: transparent; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px 0; }
.chance { padding: 8px 0; border-top: 1px solid var(--line); }
.chance:first-of-type { border-top: 0; }
.chance .h { display: flex; justify-content: space-between; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 6px 0 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.chance .o { font-size: 12px; color: var(--muted); }
.offline { background: #3a1f1a; color: #ffd9cf; border-radius: 10px; padding: 10px 12px; font-size: 14px; display: none; }
.hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="offline" id="offline"></div>
  <div class="top">
    <div class="total" id="total">–<small>ChestCounter+</small></div>
    <span class="badge" id="badge"></span>
  </div>
  <section class="card ask hidden" id="ask"></section>
  <section class="card hidden" id="tapCard">
    <div class="count"><span id="tapLabel"></span><b id="taps">0</b></div>
    <div class="tap">
      <button class="big" id="tapBtn"></button>
      <button class="small" id="undoBtn"></button>
    </div>
    <p class="help" id="tapHelp"></p>
  </section>
  <section class="card" id="summary"></section>
  <section class="card hidden" id="matches"></section>
  <section class="card" id="chances"></section>
</main>
<script>
const KEY = "__KEY__";
let S = null, editing = null, draft = {}, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function post(path, params) {
  const q = new URLSearchParams({ k: KEY, ...params });
  try { await fetch(path + "?" + q, { method: "POST" }); } catch (e) {}
  setTimeout(load, 400); setTimeout(load, 1500);
}

async function load() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("/api/state?k=" + KEY, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    S = await r.json();
    $("offline").style.display = "none";
    render();
  } catch (e) {
    $("offline").textContent = S?.ui?.offline || "PC injoignable";
    $("offline").style.display = "block";
  } finally { busy = false; }
}

function steps(id, value) {
  draft[id] ??= value;
  return `<button data-step="${id}" data-d="-1">−</button><span class="n">${draft[id]}</span>`
    + `<button data-step="${id}" data-d="1">+</button><button class="ok" data-ok="${id}">${esc(S.ui.ok)}</button>`;
}
const stepper = (id, value) => `<div class="stepper">${steps(id, value)}</div>`;

function render() {
  const u = S.ui, c = S.console;
  $("total").innerHTML = esc(S.total) + "<small>ChestCounter+</small>";
  $("badge").textContent = S.badge; $("badge").className = "badge " + S.state;

  // Question de fin de partie (console, au-delà de 1 000)
  const pending = c?.matches?.find(m => m.needs);
  if (pending && editing !== pending.id) {
    $("ask").innerHTML = `<p>${esc(u.endedAt[0].toUpperCase() + u.endedAt.slice(1))} ${esc(pending.ended)} · ${esc(u.ask)}</p>` + stepper(pending.id, pending.value);
    $("ask").classList.remove("hidden");
  } else $("ask").classList.add("hidden");

  // +1 coffre (console)
  if (c) {
    $("tapCard").classList.remove("hidden");
    // Écran lu (Chiaki…) : le compte est automatique, plus besoin d'appuyer.
    $("tapLabel").textContent = u.current + (c.screen ? " · " + u.screen : "");
    $("taps").textContent = c.screen ? c.seen + (c.ammo ? ` · ${c.ammo} ${u.ammo}` : "") : c.taps;
    document.querySelector(".tap").classList.toggle("hidden", !!c.screen);
    $("tapBtn").textContent = u.tap; $("undoBtn").textContent = u.undo; $("tapHelp").textContent = c.screen ? u.screenHelp : u.tapHelp;
  } else $("tapCard").classList.add("hidden");

  $("summary").innerHTML = S.summary.map(l => `<div class="line"><div>${esc(l.label)}${l.detail ? `<div class="d">${esc(l.detail)}</div>` : ""}</div><div class="v">${esc(l.value)}</div></div>`).join("");

  if (c?.matches?.length) {
    $("matches").innerHTML = `<h2>${esc(u.matches)}</h2>` + c.matches.map(m => {
      const val = `<span class="${m.estimated ? "est" : ""}">${m.estimated ? "≈ " : ""}${m.value}</span>`;
      if (editing === m.id) return `<div class="match"><span>${esc(m.ended)}</span>${val}</div><div class="row-edit">${steps(m.id, m.value)}</div>`
        + `<button class="forget" data-forget="${m.id}">${esc(u.notMatch)}</button>`;
      return `<div class="match"><span>${esc(m.ended)}${m.screen ? " · 📺" : m.taps ? ` · ${m.taps} 📱` : ""}${m.ammo ? ` · ${m.ammo} ${esc(u.ammo)}` : ""}</span><button class="edit" data-edit="${m.id}">${val}</button></div>`;
    }).join("");
    $("matches").classList.remove("hidden");
  } else $("matches").classList.add("hidden");

  $("chances").innerHTML = `<h2>${esc(u.chancesTitle)}</h2>` + (S.chancesEmpty ? `<div class="o">${esc(S.chancesEmpty)}</div>` :
    S.chances.map(x => `<div class="chance"><div class="h"><span>${esc(x.label)}</span><b>${esc(x.percent)}</b></div><div class="bar"><i style="width:${Math.max(1, x.fill * 100)}%"></i></div><div class="o">${esc(x.odds)}</div></div>`).join(""));
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "tapBtn") { $("taps").textContent = (+$("taps").textContent || 0) + 1; navigator.vibrate?.(30); post("/api/tap", { d: 1 }); return; }
  if (t.id === "undoBtn") { $("taps").textContent = Math.max(0, (+$("taps").textContent || 0) - 1); post("/api/tap", { d: -1 }); return; }
  if (t.dataset.step) { const id = t.dataset.step; draft[id] = Math.max(0, Math.min(200, draft[id] + +t.dataset.d)); render(); return; }
  if (t.dataset.ok) { const id = t.dataset.ok; post("/api/answer", { id, n: draft[id] }); delete draft[id]; editing = null; render(); return; }
  if (t.dataset.edit) { editing = t.dataset.edit; delete draft[editing]; render(); return; }
  if (t.dataset.forget) { post("/api/forget", { id: t.dataset.forget }); editing = null; render(); }
});

load();
setInterval(load, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
